name: Physics tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physics:
    name: Physics harness (${{ matrix.configuration }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Scoped to the test project rather than Space.sln: the solution build currently fails on
      # missing static-rollback/static-rollback-litenetlib CHANGELOG.md packaging files, which is
      # unrelated to physics (see docs/physics-box3d-migration-assessment.md, Verification Status).
      - name: Restore test project
        run: dotnet restore Test/Test.csproj

      - name: Run physics checks
        run: dotnet run --project Test/Test.csproj --configuration ${{ matrix.configuration }} --no-restore
